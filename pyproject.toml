[build-system]
requires = ["setuptools>=68", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thorvg-cython"
version = "0.0.5"
description = "Cython bindings for the ThorVG vector graphics library"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest", "cibuildwheel", "meson", "ninja"]

# ---------------------------------------------------------------------------
#  cibuildwheel configuration
#
#  Downloads thorvg release source tarball (not git clone).
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_i686"
environment = { THORVG_ROOT = "thorvg", THORVG_VERSION = "1.0.5" }
test-requires = ["pytest"]
test-command = "pytest {project}/tests -v"


[tool.cibuildwheel.linux]
before-all = "python {project}/tools/build_thorvg.py linux --thorvg-root={project}/thorvg --version=$THORVG_VERSION"
# auditwheel needs to find the versioned SONAME (libthorvg-1.so.1) at repair time
# $(uname -m) resolves to x86_64 or aarch64 inside the manylinux container
repair-wheel-command = "LD_LIBRARY_PATH={project}/thorvg/output/linux_$(uname -m) auditwheel repair -w {dest_dir} {wheel}"
environment = { THORVG_ROOT = "thorvg", THORVG_VERSION = "1.0.5", THORVG_LIB_DIR = "thorvg/output" }

[tool.cibuildwheel.macos]
before-all = "python {project}/tools/build_thorvg.py macos --thorvg-root={project}/thorvg --version=$THORVG_VERSION"
environment = { THORVG_ROOT = "thorvg", THORVG_VERSION = "1.0.5", THORVG_LIB_DIR = "thorvg/output/macos_fat", ANGLE_LIB_DIR = "thorvg/output/angle", MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
before-all = "python {project}\\tools\\build_thorvg.py windows --thorvg-root={project}\\thorvg --version=%THORVG_VERSION%"
environment = { THORVG_ROOT = "thorvg", THORVG_VERSION = "1.0.5", THORVG_LIB_DIR = "thorvg/output" }

[tool.cibuildwheel.ios]
before-all = "python3 {project}/tools/build_thorvg.py ios --thorvg-root={project}/thorvg --version=$THORVG_VERSION"
xbuild-tools = ["ninja"]
environment = { THORVG_ROOT = "thorvg", THORVG_VERSION = "1.0.5", THORVG_LIB_DIR = "thorvg/output/ios_arm64" }
test-sources = ["tests"]
test-command = ""

[tool.cibuildwheel.android]
before-all = "python3 {project}/tools/build_thorvg.py android --thorvg-root={project}/thorvg --version=$THORVG_VERSION --api=24"
# Inject libthorvg-1.so into .libs/{abi}/ so preload.py can find it at test
# time and Gradle can pick it up for the APK at deploy time.
repair-wheel-command = "cp {wheel} {dest_dir}/ && THORVG_LIB_DIR={project}/thorvg/output python3 {project}/tools/add_android_libs.py {dest_dir}"
environment = { THORVG_ROOT = "thorvg", THORVG_VERSION = "1.0.5", THORVG_LIB_DIR = "thorvg/output", ANDROID_API_LEVEL = "24" }
test-sources = ["tests"]
# preload.py loads libthorvg-1.so from site-packages/.libs/{abi}/ before
# importing any Cython extension (Android classloader-namespace workaround).
test-command = "python -m pytest ./tests -v"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
