site_name: thorvg-cython
site_description: High-performance Cython bindings for the ThorVG vector graphics library
site_url: https://py-swift.github.io/thorvg-cython/
repo_url: https://github.com/Py-Swift/thorvg-cython
repo_name: Py-Swift/thorvg-cython

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest
    - search.share
    - toc.follow
    - announce.dismiss
  icon:
    repo: fontawesome/brands/github
    logo: material/vector-polygon
  font:
    text: Inter
    code: JetBrains Mono

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Py-Swift/thorvg-cython
      name: thorvg-cython on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/thorvg-cython/
      name: thorvg-cython on PyPI
  generator: false
  status:
    new: Recently added
    deprecated: Deprecated

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.keys
  - attr_list
  - md_in_html
  - def_list
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - API Reference:
      - Overview: api/overview.md
      - Engine: api/engine.md
      - Canvas: api/canvas.md
      - Paint: api/paint.md
      - Shape: api/shape.md
      - Picture: api/picture.md
      - Scene: api/scene.md
      - Text: api/text.md
      - Gradients: api/gradients.md
      - Animation: api/animation.md
      - Utilities: api/utilities.md
  - Guides:
      - GPU Rendering: guides/gpu-rendering.md
      - Kivy Integration: guides/kivy-integration.md
      - Buffer Protocol: guides/buffer-protocol.md
      - Game Development: guides/game-development.md
  - Examples:
      - Basic Shapes: examples/basic-shapes.md
      - SVG Rendering: examples/svg-rendering.md
      - Lottie Animations: examples/lottie-animations.md
      - GPU Games: examples/gpu-games.md
